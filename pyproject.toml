[project]
name = "auditor"
version = "0.1.1"
description = "TUI para automatizar la remediación de vulnerabilidades npm en repositorios Node.js"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "textual>=8.2.8",
]
scripts = { auditor = "auditor.__main__:main" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[build-system]
requires = ["uv_build>=0.9,<1.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

